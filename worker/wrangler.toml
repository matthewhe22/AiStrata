name = "strataflow-form"
main = "src/index.js"
compatibility_date = "2026-10-10"

# Cloudflare Email Routing sending. The recipient must be an address already
# verified in Email Routing for this account.
[[send_email]]
name = "SEND_EMAIL"

# Route the site's own /api/* at the Worker. A Workers route only takes effect
# once the hostname is proxied through Cloudflare; today strataflow.work is a
# DNS-only CNAME to Netlify, so this activates when the Pages cutover proxies
# the zone. Until then the Worker is reachable at
# https://strataflow-form.strataflow.workers.dev
routes = [
  { pattern = "strataflow.work/api/*", zone_name = "strataflow.work" }
]
