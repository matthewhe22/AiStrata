<!DOCTYPE html>
<html lang="en-AU">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found — StrataFlow</title>
    <meta name="robots" content="noindex,follow">
    <meta name="description" content="That page could not be found. Head back to the StrataFlow homepage, the live demo, or download the free strata compliance checklist.">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root { --primary: #2563EB; --ink: #111418; --ink-muted: #6E7278; --hair: rgba(0,0,0,0.09); }
        /* Metric-compatible fallback for Inter — avoids the font-swap layout shift. */
        @font-face {
            font-family: 'Inter Fallback';
            font-style: normal;
            font-weight: 100 900;
            src: local('Arial');
            ascent-override: 90%;
            descent-override: 22.43%;
            line-gap-override: 0%;
            size-adjust: 107.06%;
        }
        body {
            font-family: 'Inter', 'Inter Fallback', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: var(--ink); background: #fff; line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh; display: flex; flex-direction: column;
        }
        header { border-bottom: 1px solid var(--hair); }
        .container { max-width: 1120px; margin: 0 auto; padding: 0 24px; width: 100%; }
        header .container { display: flex; align-items: center; height: 68px; }
        .logo { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; font-weight: 800; letter-spacing: -0.02em; font-size: 1.125rem; }
        .logo img { width: 28px; height: 28px; }
        .logo span span { color: var(--primary); }
        main { flex: 1; display: flex; align-items: center; padding: 80px 0; }
        .code { font-size: clamp(4rem, 12vw, 7rem); font-weight: 800; letter-spacing: -0.04em; line-height: 1; color: var(--primary); }
        h1 { font-size: clamp(1.75rem, 4vw, 2.75rem); font-weight: 800; letter-spacing: -0.03em; margin-top: 20px; }
        p { color: var(--ink-muted); max-width: 52ch; margin-top: 18px; font-size: 1.0625rem; }
        .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 34px; }
        .btn { display: inline-block; padding: 13px 26px; border-radius: 980px; font-weight: 600; text-decoration: none; font-size: 0.975rem; }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: #1D4ED8; }
        .btn-secondary { border: 1px solid var(--hair); color: var(--ink); }
        .btn-secondary:hover { background: rgba(0,0,0,0.03); }
        footer { border-top: 1px solid var(--hair); padding: 24px 0; font-size: 0.875rem; color: var(--ink-muted); }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <a class="logo" href="/">
                <img src="/logo-180.png" alt="" width="28" height="28" aria-hidden="true">
                <span>Strata<span>Flow</span></span>
            </a>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="code">404</div>
            <h1>We could not find that page.</h1>
            <p>The link may be out of date, or the page may have moved. Here is where most people are heading:</p>
            <div class="actions">
                <a class="btn btn-primary" href="/">Back to homepage</a>
                <a class="btn btn-secondary" href="/demo">See the live demo</a>
                <a class="btn btn-secondary" href="/checklist">Free compliance checklist</a>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <span>&copy; 2026 StrataFlow Pty Ltd. AI workflow automation for Australian strata managers.</span>
        </div>
    </footer>
</body>
</html>
